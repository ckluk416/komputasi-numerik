name: notebook to pdf

on:
  push:
    paths:
      - "**.ipynb"
      - ".github/workflows/notebook-pdf.yml"
  pull_request:
    paths:
      - "**.ipynb"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: install nbconvert
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nbconvert[webpdf]"

      - name: install chromium for playwright
        run: python -m playwright install --with-deps chromium

      - name: convert notebook to pdf
        run: |
          mkdir -p pdf
          shopt -s nullglob globstar
          notebooks=(**/*.ipynb)
          if [ ${#notebooks[@]} -eq 0 ]; then
            echo "tidak ada berkas .ipynb di repo"
            exit 1
          fi
          for nb in "${notebooks[@]}"; do
            echo "converting $nb"
            python -m jupyter nbconvert --to webpdf --output-dir pdf "$nb"
          done
          ls -lh pdf

      - name: upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: notebook-pdf
          path: pdf/*.pdf
          if-no-files-found: error
          retention-days: 30
